name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request supersedes the older run; every push to main
  # still pushes its image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.8

      - name: Lint and test
        run: mise run ci

  image:
    needs: check
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          cache-key: Dockerfile

      - name: Build the image
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          load: true
          tags: edity-server:ci

      # Starting at all proves the binary is static: the distroless base has no libc.
      - name: Smoke-test the image
        run: |
          set -euo pipefail
          trap 'docker logs edity-server' EXIT
          docker run --detach --name edity-server --publish 8080:8080 \
            --volume "$PWD/sites.dev.json:/etc/edity-server/sites.json:ro" \
            --env EDITY_SITES_FILE=/etc/edity-server/sites.json \
            --env EDITY_PUBLISHER_GITHUB_APP_ID=1 \
            --env EDITY_PUBLISHER_GITHUB_APP_PRIVATE_KEY="$(openssl genrsa 2048 2>/dev/null)" \
            edity-server:ci
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://localhost:8080/healthz
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: unknown.example.com' http://localhost:8080/_edity/api/session)
          test "$status" = 404

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/rmypg/edity-server
          tags: |
            type=raw,value=development,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long

      - name: Push the image
        if: github.event_name == 'push'
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
