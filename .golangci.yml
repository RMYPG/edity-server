version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - nolintlint
    - usestdlibvars
  exclusions:
    rules:
      # Tests, and the helpers they share, hold fake keys and read temporary
      # files and recordings on purpose.
      - path: (_test\.go|internal/githubtest/)
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
