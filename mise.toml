[tools]
go = "1.27.2"
golangci-lint = "2.15.0"
# Lints the OpenAPI file, api/openapi.yaml.
vacuum = "0.35.7"
jactionlint = "2.3.0"
# jactionlint checks workflow scripts with it.
shellcheck = "0.11.0"
# Same version as platform's mise.toml.
infisical = "0.43.132"

[tasks.lint]
description = "Lint the Go code, the OpenAPI file and the GitHub workflows"
run = [
  "go mod tidy -diff",
  "golangci-lint run",
  # A List's Items are content values too, so ContentValue refers to itself
  # through an array on purpose.
  "vacuum lint --ruleset api/vacuum-ruleset.yaml --fail-severity warn --ignore-array-circle-ref --details --no-banner --no-update-check api/openapi.yaml",
  "jactionlint",
]

[tasks.test]
description = "Run the tests"
run = "go test ./..."

[tasks.ci]
description = "Run the linters and the tests, as CI does before building the image"
depends = ["lint", "test"]

[tasks."check:sandbox"]
description = "Publish on RMYPG/edity-sandbox for real, twice, and wait for each Release, as the Developer's own Infisical user (not part of ci)"
env = { EDITY_SITES_FILE = "{{config_root}}/sites.dev.json" }
run = "infisical run --env=dev --path=/github -- go test -tags sandbox -run TestPublishOnTheSandbox -count=1 -timeout 75m -v ./internal/publish"

[tasks."check:progress"]
description = "Read the progress of the two Publishes check:sandbox made on RMYPG/edity-sandbox from GitHub, reading only, as the Developer's own Infisical user (not part of ci)"
env = { EDITY_SITES_FILE = "{{config_root}}/sites.dev.json" }
run = "infisical run --env=dev --path=/github -- go test -tags sandbox -run TestProgressOnTheSandbox -count=1 -v ./internal/progress"

[tasks.dev]
description = "Run the server locally with the dev secrets, as the Developer's own Infisical user"
env = { EDITY_SITES_FILE = "sites.dev.json" }
run = "infisical run --env=dev --path=/github -- go run ./cmd/edity-server"
